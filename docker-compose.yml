services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
  app:
    build: .
    depends_on: [mongo]
    ports: ["5000:5000"]
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/skillswap
      JWT_SECRET: change_me
      JWT_REFRESH_SECRET: change_me_too
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
volumes:
  mongo-data:
